name: PSIE — tests

on:
  push:
    paths:
      - "psie/**"
      - ".github/workflows/psie-tests.yml"
  pull_request:
    paths:
      - "psie/**"
      - ".github/workflows/psie-tests.yml"

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psie/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: psie/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  tests-postgres:
    name: tests-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psie
          POSTGRES_PASSWORD: psie
          POSTGRES_DB: psie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U psie" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: psie/backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://psie:psie@localhost:5432/psie_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: psie/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Suite de tests sur PostgreSQL
        run: python -m pytest -q
      - name: Migrations sur une base vierge, puis contrôle de dérive
        env:
          DATABASE_URL: postgresql+psycopg2://psie:psie@localhost:5432/psie_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg2://psie:psie@localhost:5432/postgres", isolation_level="AUTOCOMMIT")
          with e.connect() as c:
              c.execute(text("DROP DATABASE IF EXISTS psie_migr"))
              c.execute(text("CREATE DATABASE psie_migr"))
          PY
          export DATABASE_URL=postgresql+psycopg2://psie:psie@localhost:5432/psie_migr
          alembic upgrade head
          alembic check
          python -m scripts.init_db

  docker:
    name: docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psie/deploy
    steps:
      - uses: actions/checkout@v4
      - name: Valider la composition de production (les deux modes)
        run: |
          cp .env.example .env
          docker compose --env-file .env config > /dev/null
          docker compose --env-file .env --profile caddy config > /dev/null
      - name: Démarrer la pile de production avec des valeurs de test
        run: |
          sed -i \
            -e 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' \
            -e 's/^TWO_FACTOR_ENABLED=.*/TWO_FACTOR_ENABLED=false/' \
            -e 's/^SECRET_KEY=.*/SECRET_KEY=ci-secret-key/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password-123/' \
            -e 's#^PUBLIC_BASE_URL=.*#PUBLIC_BASE_URL=http://localhost:8100#' .env
          docker compose --env-file .env up -d --build
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8100/health/db && break; sleep 3; done
          curl -sf http://127.0.0.1:8100/health/db
      - name: Initialiser la base (migrations puis amorçage)
        run: docker compose exec -T api python -m scripts.init_db
      - name: Les pages publiques répondent
        run: |
          curl -sf http://127.0.0.1:8100/ > /dev/null
          curl -sf http://127.0.0.1:8100/login > /dev/null
          curl -sf http://127.0.0.1:8100/membres | grep -q LECIM
      - name: Sauvegarde chiffrée puis restauration de test (vrais scripts, via Docker)
        run: |
          echo "phrase-secrete-de-test" > backup.pass
          ./backup.sh
          ./restore.sh --test backups/*.enc
      - name: Journaux de l'application (si échec)
        if: failure()
        run: docker compose logs --tail=80 api db
      - name: Nettoyer
        if: always()
        run: docker compose down -v
