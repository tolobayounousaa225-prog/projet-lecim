name: PSIE — tests

on:
  push:
    paths:
      - "psie/**"
      - ".github/workflows/psie-tests.yml"
  pull_request:
    paths:
      - "psie/**"
      - ".github/workflows/psie-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psie/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: psie/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
