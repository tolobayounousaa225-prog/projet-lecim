{% extends "etablissement/base.html" %}
{% block title %}Changer mon mot de passe{% endblock %}
{% block content %}
<h1>Changer mon mot de passe</h1>
<div class="form-card" style="max-width:480px;">
  {% if success %}<div class="form-card" style="background:var(--cream); box-shadow:none; padding:12px; margin-bottom:16px; color:var(--green-dark); font-weight:600;">{{ success }}</div>{% endif %}
  {% if error %}<div class="error-box" style="margin-bottom:16px;">{{ error }}</div>{% endif %}
  <form method="post" action="/etablissement/mon-compte/mot-de-passe">
    <div class="form-group">
      <label for="mot_de_passe_actuel">Mot de passe actuel</label>
      <input type="password" id="mot_de_passe_actuel" name="mot_de_passe_actuel" required>
    </div>
    <div class="form-group">
      <label for="nouveau_mot_de_passe">Nouveau mot de passe</label>
      <input type="password" id="nouveau_mot_de_passe" name="nouveau_mot_de_passe" required minlength="8">
      <p style="font-size:0.78rem; color:var(--text-muted); margin:4px 0 0;">Au moins 8 caractères, avec une lettre et un chiffre.</p>
    </div>
    <div class="form-group">
      <label for="confirmation">Confirmer le nouveau mot de passe</label>
      <input type="password" id="confirmation" name="confirmation" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
  </form>
</div>
{% endblock %}
