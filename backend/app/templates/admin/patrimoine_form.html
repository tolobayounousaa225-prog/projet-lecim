{% extends "admin/base.html" %}
{% block title %}{{ "Modifier" if item else "Nouveau" }} bien{% endblock %}
{% block content %}
<h1>{{ "Modifier le bien" if item else "Ajouter un bien" }}</h1>
<div class="form-card">
  <form method="post" action="{{ '/admin/patrimoine/' ~ item.id ~ '/edit' if item else '/admin/patrimoine/new' }}">
    <div class="form-group">
      <label for="designation">Désignation</label>
      <input type="text" id="designation" name="designation" required value="{{ item.designation if item else '' }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="categorie">Catégorie</label>
        <select id="categorie" name="categorie">
          {% for key, label in categories.items() %}
          <option value="{{ key }}" {% if item and item.categorie == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="etat">État</label>
        <select id="etat" name="etat">
          {% for key, label in etats.items() %}
          <option value="{{ key }}" {% if item and item.etat == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="quantite">Quantité</label>
        <input type="number" id="quantite" name="quantite" min="1" value="{{ item.quantite if item else 1 }}">
      </div>
      <div class="form-group">
        <label for="localisation">Localisation</label>
        <input type="text" id="localisation" name="localisation" value="{{ item.localisation if item else '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="date_acquisition">Date d'acquisition</label>
        <input type="date" id="date_acquisition" name="date_acquisition" value="{{ item.date_acquisition.isoformat() if item and item.date_acquisition else '' }}">
      </div>
      <div class="form-group">
        <label for="valeur_estimee">Valeur estimée (FCFA)</label>
        <input type="number" id="valeur_estimee" name="valeur_estimee" min="0" value="{{ item.valeur_estimee if item and item.valeur_estimee else '' }}">
      </div>
    </div>
    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes">{{ item.notes if item else '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="/admin/patrimoine" class="btn btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
