{% extends "admin/base.html" %}
{% block title %}Enregistrer une vente de livre{% endblock %}
{% block content %}
<h1>Enregistrer une vente de livre</h1>
<div class="form-card">
  <form method="post" action="/admin/ventes-livres/new">
    <div class="form-group">
      <label for="titre">Titre du livre / description</label>
      <input type="text" id="titre" name="titre" required placeholder="ex : Recueil de duas">
    </div>
    <div class="form-group">
      <label for="quantite">Quantité vendue</label>
      <input type="number" id="quantite" name="quantite" min="1" required value="1">
    </div>
    <div class="form-group">
      <label for="montant">Montant total (FCFA)</label>
      <input type="number" id="montant" name="montant" min="0" required>
    </div>
    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required value="{{ today.isoformat() }}">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="/admin/ventes-livres" class="btn btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
