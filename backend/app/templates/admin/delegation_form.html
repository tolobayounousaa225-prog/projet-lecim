{% extends "admin/base.html" %}
{% block title %}{{ "Modifier" if item else "Nouvelle" }} délégation{% endblock %}
{% block content %}
<h1>{{ "Modifier la délégation" if item else "Créer une délégation régionale" }}</h1>
<div class="form-card">
  <form method="post" action="{{ '/admin/delegations/' ~ item.id ~ '/edit' if item else '/admin/delegations/new' }}">
    <div class="form-group">
      <label for="nom">Nom de la délégation</label>
      <input type="text" id="nom" name="nom" required placeholder="Ex. Délégation régionale de Bouaké" value="{{ item.nom if item else '' }}">
    </div>
    <div class="form-group">
      <label for="region">Région</label>
      <input type="text" id="region" name="region" placeholder="Ex. Gbêkê" value="{{ item.region if item else '' }}">
    </div>
    <div class="form-group">
      <label for="latitude">Latitude (pour la carte interactive du site)</label>
      <input type="text" id="latitude" name="latitude" placeholder="Ex : 7.694" value="{{ item.latitude if item and item.latitude is not none else '' }}">
    </div>
    <div class="form-group">
      <label for="longitude">Longitude</label>
      <input type="text" id="longitude" name="longitude" placeholder="Ex : -5.030" value="{{ item.longitude if item and item.longitude is not none else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="/admin/delegations" class="btn btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
