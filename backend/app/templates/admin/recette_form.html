{% extends "admin/base.html" %}
{% block title %}Enregistrer une recette{% endblock %}
{% block content %}
<h1>Enregistrer une recette</h1>
<div class="form-card">
  <form method="post" action="/admin/recettes/new">
    <div class="form-group">
      <label for="categorie">Catégorie</label>
      <select id="categorie" name="categorie" required>
        {% for key, label in categories.items() %}
        <option value="{{ key }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="libelle">Libellé</label>
      <input type="text" id="libelle" name="libelle" required placeholder="ex : Vente de livres — Conférence des Présidents 2026">
    </div>
    <div class="form-group">
      <label for="montant">Montant (FCFA)</label>
      <input type="number" id="montant" name="montant" min="0" required>
    </div>
    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required value="{{ today.isoformat() }}">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="/admin/recettes" class="btn btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
