{% extends "admin/base.html" %}
{% block title %}{{ "Modifier la visite" if item else "Enregistrer une visite" }}{% endblock %}
{% block content %}
<h1>{{ "Modifier la visite" if item else "Enregistrer une visite" }}</h1>
<div class="form-card">
  <form method="post" action="{{ '/admin/visites/' ~ item.id ~ '/edit' if item else '/admin/visites/new' }}">
    <div class="form-row">
      <div class="form-group">
        <label for="etablissement_id">Établissement</label>
        <select id="etablissement_id" name="etablissement_id" required>
          <option value="">— Choisir —</option>
          {% for e in etablissements %}
          <option value="{{ e.id }}" {% if item and item.etablissement_id == e.id %}selected{% endif %}>{{ e.nom }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="date">Date de la visite</label>
        <input type="date" id="date" name="date" required value="{{ item.date.isoformat() if item else '' }}">
      </div>
    </div>
    <div class="form-group">
      <label for="constat">Constat</label>
      <textarea id="constat" name="constat" required>{{ item.constat if item else "" }}</textarea>
    </div>
    <div class="form-group">
      <label for="suites_a_donner">Suites à donner (optionnel)</label>
      <textarea id="suites_a_donner" name="suites_a_donner">{{ item.suites_a_donner or "" if item else "" }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="/admin/visites" class="btn btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
