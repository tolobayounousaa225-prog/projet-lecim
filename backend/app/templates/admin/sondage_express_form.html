{% extends "admin/base.html" %}
{% block title %}Nouveau sondage express{% endblock %}
{% block content %}
<h1>Créer un sondage express</h1>
<div class="form-card">
  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/sondages-express/new">
    <div class="form-group">
      <label for="question">Question</label>
      <input type="text" id="question" name="question" required placeholder="Ex : Quel sujet aimeriez-vous voir traité lors de la prochaine AG ?">
    </div>
    <div class="form-group">
      <label for="option1">Option 1</label>
      <input type="text" id="option1" name="option1" required>
    </div>
    <div class="form-group">
      <label for="option2">Option 2</label>
      <input type="text" id="option2" name="option2" required>
    </div>
    <div class="form-group">
      <label for="option3">Option 3 (optionnel)</label>
      <input type="text" id="option3" name="option3">
    </div>
    <div class="form-group">
      <label for="option4">Option 4 (optionnel)</label>
      <input type="text" id="option4" name="option4">
    </div>
    <div class="form-group checkbox-row">
      <input type="checkbox" id="is_active" name="is_active" value="true" checked>
      <label for="is_active" style="margin:0">Activer immédiatement (désactive le sondage actuellement actif)</label>
    </div>
    <button type="submit" class="btn btn-primary">Créer</button>
    <a href="/admin/sondages-express" class="btn btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
