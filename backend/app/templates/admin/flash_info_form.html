{% extends "admin/base.html" %}
{% block title %}Modifier le message flash{% endblock %}
{% block content %}
<h1>Modifier le message flash</h1>
<div class="form-card">
  <form method="post" action="/admin/flash-info/{{ item.id }}/edit">
    <div class="form-group">
      <label for="message">Message</label>
      <input type="text" id="message" name="message" required maxlength="500" value="{{ item.message }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="lien">Lien (optionnel)</label>
        <input type="url" id="lien" name="lien" placeholder="https://..." value="{{ item.lien or '' }}">
      </div>
      <div class="form-group">
        <label for="ordre">Ordre d'affichage</label>
        <input type="number" id="ordre" name="ordre" value="{{ item.ordre }}">
      </div>
    </div>
    <div class="form-group checkbox-row">
      <input type="checkbox" id="is_active" name="is_active" value="true" {% if item.is_active %}checked{% endif %}>
      <label for="is_active" style="margin:0">Actif (visible immédiatement sur le site)</label>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="/admin/flash-info" class="btn btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
