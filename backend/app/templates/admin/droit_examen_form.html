{% extends "admin/base.html" %}
{% block title %}Enregistrer un droit d'examen{% endblock %}
{% block content %}
<h1>Enregistrer un droit d'examen</h1>
<div class="form-card">
  <form method="post" action="/admin/droits-examens/new">
    <div class="form-group">
      <label for="libelle">Libellé</label>
      <input type="text" id="libelle" name="libelle" required placeholder="ex : Droits d'inscription BEPC 2026">
    </div>
    <div class="form-group">
      <label for="type_examen">Examen concerné</label>
      <select id="type_examen" name="type_examen">
        <option value="">— Non précisé —</option>
        <option value="CEPE">CEPE</option>
        <option value="BEPC">BEPC</option>
        <option value="BAC">BAC</option>
      </select>
    </div>
    <div class="form-group">
      <label for="etablissement_id">Établissement concerné (facultatif)</label>
      <select id="etablissement_id" name="etablissement_id">
        <option value="">— Non rattaché à un établissement —</option>
        {% for e in etablissements %}
        <option value="{{ e.id }}">{{ e.nom }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="montant">Montant (FCFA)</label>
      <input type="number" id="montant" name="montant" min="0" required>
    </div>
    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required value="{{ today.isoformat() }}">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="/admin/droits-examens" class="btn btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
