<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — LECIM</title>
<link rel="icon" type="image/jpeg" href="/static/img/logo.jpg">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img src="/static/img/logo.jpg" alt="Logo LECIM" class="login-logo">
    <h1>Mot de passe oublié</h1>
    <p class="sub">Renseignez l'adresse e-mail de votre compte LECIM (BEN, délégation ou établissement).</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    {% if message %}
    <div class="form-card" style="background:var(--cream); box-shadow:none; padding:16px; font-size:0.88rem;">{{ message }}</div>
    <p style="text-align:center; margin-top:18px; font-size:0.82rem;"><a href="/admin/login">&larr; Retour à la connexion</a></p>
    {% else %}
    <form method="post" action="/mot-de-passe-oublie">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Recevoir un mot de passe temporaire</button>
    </form>
    <p style="text-align:center; margin-top:18px; font-size:0.82rem;"><a href="/admin/login">&larr; Retour à la connexion</a></p>
    {% endif %}
  </div>
</div>
</body>
</html>
