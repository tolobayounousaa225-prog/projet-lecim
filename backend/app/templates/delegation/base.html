<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Espace délégation{% endblock %} — LECIM</title>
<link rel="icon" type="image/jpeg" href="/static/img/logo.jpg">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="/static/img/logo.jpg" alt="Logo LECIM">
      <h2>LECIM</h2>
    </div>
    <span class="tag">{{ delegation.nom }}</span>
    <nav>
      <a href="/delegation" class="{{ 'active' if active == 'dashboard' else '' }}">Tableau de bord</a>
      <a href="/delegation/reunions" class="{{ 'active' if active == 'reunions' else '' }}">Réunions locales</a>
      <a href="/delegation/membres" class="{{ 'active' if active == 'membres' else '' }}">Comité local</a>
      <a href="/delegation/cotisations" class="{{ 'active' if active == 'cotisations' else '' }}">Cotisations (lecture seule)</a>
      <a href="/delegation/annonces" class="{{ 'active' if active == 'annonces' else '' }}">Annonces</a>
    </nav>
    <div class="logout">
      <a href="/delegation/logout">Se déconnecter</a>
    </div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
