{% extends "base.html" %}
{% block title %}{{ t('verify_title') }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('verify_title') }}</h1>
  <p class="muted">{{ t('verify_help') }}</p>
  {% if error %}<p class="alert">{{ t(error) }}</p>{% endif %}
  <form method="post" action="/login/verification" class="stack">
    <label>{{ t('code') }}<input name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus></label>
    <button class="btn">{{ t('verify') }}</button>
  </form>
</section>
{% endblock %}
