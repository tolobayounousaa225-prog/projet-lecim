{% extends "base.html" %}
{% block title %}{{ t('login_title') }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('login_title') }}</h1>
  {% if error %}<p class="alert">{{ t(error) }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>{{ t('email') }}<input type="email" name="email" required autofocus autocomplete="username"></label>
    <label>{{ t('password') }}<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn">{{ t('sign_in') }}</button>
  </form>
</section>
{% endblock %}
